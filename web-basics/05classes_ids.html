<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 05 : Classes, Ids</title>

    <style>
        body{
            background-color: bisque;
            color: blueviolet;
            font-family: Georgia, 'Times New Roman', Times, serif;
            margin: 0;
            padding: 0;
        }
        
        #page-wrapper{
            max-width: 700px;
            margin:0 auto;
            padding:40px 24px;
        }
        
        #band-photos{
            width: 300px;
            height: 300px;
            object-fit: cover;
        }

        #photos{
            background-color: blanchedalmond;
        }

        #listen-section{
            position: relative;
            display: flex;
            justify-content: center;
            align-content: center;
            width: 500px;
            height: 500px;
            background-color: beige;
        }
      
        </style>
</head>
<body>
    <!--
    id: unique, only one element in a page should have it 
    
    class: reusableused to identify multiple elements together
    -->

    <div id="page-wrapper">
        
        <h1>Pentatonix</h1>
        <p>Disc: Band from States, making melodies with vocal harmonies</p>

        <div id="Photos">
            <img class="band-photo" src="./Assests/Images/Pentatonix.jpg" alt="band photo">
        </div>

    <div id="listen section">
        <p class="song">Latest song</p>
        <p class="song">Earlier song</p>
    </div>

</body>
</html>
